services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wind-eval-backend
    ports:
      - "8000:8000"
    environment:
      # Browser origins allowed to call the API directly (the nginx proxy on :3000 is same-origin)
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: wind-eval-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
